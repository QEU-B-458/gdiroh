name: jobs/build

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    working-directory: gdiroh

jobs:
  check:
    name: Format, lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: gdiroh

      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --locked

  build:
    name: Build - ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: linux/x86_64
            bin: libgdiroh.so

          # Native arm64 runner, so ring and the other C dependencies build
          # without a cross toolchain.
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            artifact: linux/arm64
            bin: libgdiroh.so

          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: windows/x86_64
            bin: gdiroh.dll

          - runner: macos-latest
            target: x86_64-apple-darwin
            artifact: macos/x86_64
            bin: libgdiroh.dylib

          - runner: macos-latest
            target: aarch64-apple-darwin
            artifact: macos/arm64
            bin: libgdiroh.dylib

          - runner: ubuntu-latest
            target: aarch64-linux-android
            artifact: android/arm64
            bin: libgdiroh.so

          - runner: ubuntu-latest
            target: armv7-linux-androideabi
            artifact: android/arm32
            bin: libgdiroh.so

          - runner: ubuntu-latest
            target: x86_64-linux-android
            artifact: android/x86_64
            bin: libgdiroh.so

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: gdiroh
          key: ${{ matrix.target }}

      - name: Set up Android NDK
        if: contains(matrix.target, 'android')
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c
          add-to-path: true

      - name: Install cargo-ndk
        if: contains(matrix.target, 'android')
        run: cargo install cargo-ndk --locked

      - name: Build
        if: ${{ !contains(matrix.target, 'android') }}
        run: cargo build --locked --release --target ${{ matrix.target }}

      # `-p` is pinned rather than left to cargo-ndk's default, which has moved
      # between releases. A library built against a lower API level still runs
      # on higher ones, and 21 is below any Godot 4 Android minimum.
      - name: Build (Android)
        if: contains(matrix.target, 'android')
        run: cargo ndk -t ${{ matrix.target }} -p 21 build --locked --release

      - name: Stage artifact
        shell: bash
        run: |
          mkdir -p staging/${{ matrix.artifact }}
          cp target/${{ matrix.target }}/release/${{ matrix.bin }} \
             staging/${{ matrix.artifact }}/${{ matrix.bin }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: gdiroh/staging/
          if-no-files-found: error

  package:
    name: Package addon
    runs-on: macos-latest
    needs: [check, build]
    defaults:
      run:
        # Overrides the workflow default of `gdiroh`. This job assembles the
        # addon from the repository as a whole, and `download-artifact` resolves
        # its path against the workspace root regardless of that default — so
        # leaving it set puts the artifacts and the steps reading them in two
        # different directories.
        working-directory: .
    steps:
      - uses: actions/checkout@v4

      - name: Collect build artifacts
        uses: actions/download-artifact@v4
        with:
          path: staging
          merge-multiple: true

      - name: Join the macOS binaries into one universal library
        run: |
          lipo -create -output staging/macos/libgdiroh.dylib \
            staging/macos/x86_64/libgdiroh.dylib \
            staging/macos/arm64/libgdiroh.dylib
          rm -r staging/macos/x86_64 staging/macos/arm64

      - name: Assemble addon
        run: |
          addon=godot/gdiroh-example/addons/gdiroh
          mkdir -p package/addons/gdiroh
          cp $addon/gdiroh.gdextension $addon/gdiroh.gdextension.uid package/addons/gdiroh/
          cp -r staging/* package/addons/gdiroh/
          cp LICENSE package/addons/gdiroh/
          (cd package && zip -r ../gdiroh.zip addons)

      - uses: actions/upload-artifact@v4
        with:
          name: package
          path: gdiroh.zip
          if-no-files-found: error

  release:
    name: Draft release on version bump
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: package
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check for a version change
        id: version
        run: |
          new=$(grep -m1 '^version =' Cargo.toml | sed -E 's/version = "(.*)"/\1/' | tr -d '\r')
          git show HEAD~1:gdiroh/Cargo.toml > /tmp/old_Cargo.toml 2>/dev/null || touch /tmp/old_Cargo.toml
          old=$(grep -m1 '^version =' /tmp/old_Cargo.toml | sed -E 's/version = "(.*)"/\1/' | tr -d '\r')
          echo "new=$new" >> $GITHUB_OUTPUT
          [ "$new" != "$old" ] && echo "changed=true" >> $GITHUB_OUTPUT || echo "changed=false" >> $GITHUB_OUTPUT

      - name: Download package
        if: steps.version.outputs.changed == 'true'
        uses: actions/download-artifact@v4
        with:
          name: package
          path: .

      - name: Create release
        if: steps.version.outputs.changed == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.new }}
          generate_release_notes: true
          files: gdiroh.zip
          draft: true
